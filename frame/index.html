<title>注音打卡框</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout concept: a phone-first three-step booth that ends in a 9:16 story card
   framed with the BOPOMOFO identity — grey/teal/pink/gold tones from the CIS. */
:root{
  color-scheme:light;
  --ink:#393536; --grey:#929399; --teal:#00A99F; --pink:#DA1884; --gold:#B49154;
  --paper:#FBFBFB; --card:#FFFFFF; --line:#DCDBDC; --dot:#ECECEC; --muted:#6E6B6D;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --en:"Poppins","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--zh);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle,var(--dot) 0 9px,transparent 9.5px);background-size:44px 44px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:520px;margin:0 auto;padding-block:20px 56px;display:grid;gap:22px}
.top{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.top img{height:30px;width:auto;align-self:flex-start}
h1{margin:0;font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.25;font-weight:900;text-wrap:balance}
h1 small{display:block;font-family:var(--en);font-weight:400;font-size:.42em;color:var(--muted);letter-spacing:.04em;margin-top:.3rem}
.lead{margin:0;color:var(--muted);max-width:30em}
.tones{display:flex;height:8px}.tones i{flex:1}
.card{background:var(--card);padding:18px 16px 20px;display:grid;gap:14px;min-width:0}
.card h2{margin:0;font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.6rem}
.card h2 span{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--en);font-size:.9rem;font-weight:600}
.card h2 em{font-style:normal;font-family:var(--en);font-weight:400;font-size:.78rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;background:var(--ink);color:#fff;padding:.75rem 1.1rem;font-weight:700;min-height:48px;transition:background .15s}
.btn:hover{background:#4a4647}.btn:active{background:var(--pink)}
.btn.alt{background:#ECECEC;color:var(--ink)}.btn.alt:hover{background:#DEDEDF}.btn.alt:active{background:var(--pink);color:#fff}
.btn.big{flex:1 1 100%;background:var(--pink);font-size:1.05rem;min-height:54px}
.btn.big:hover{background:#c0156f}
.hint{margin:0;font-size:.85rem;color:var(--muted)}
.chart{display:grid;gap:6px}
.chart p{margin:0;font-size:.78rem;color:var(--muted);font-weight:700}
.chart div{display:flex;flex-wrap:wrap;gap:4px}
.chart span{width:2rem;height:2rem;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:700;font-size:1.05rem}
.pad{position:relative;width:100%;aspect-ratio:3/1;background:transparent}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad .ink{touch-action:none;cursor:crosshair}
.pens{display:flex;gap:8px;align-items:center}
.pen{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.pen[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.stage{display:grid;place-items:center;background:#ECECEE;padding:12px}
.stage canvas{width:min(100%,300px);height:auto;aspect-ratio:9/16;box-shadow:0 14px 34px -16px rgba(57,53,54,.55);background:#fff}
.result{display:grid;gap:10px;justify-items:center}
.result img{width:min(100%,320px);height:auto;aspect-ratio:9/16;border:1px solid var(--line)}
.result strong{color:var(--pink)}
textarea{width:100%;min-height:84px;border:1px solid var(--line);padding:.6rem .7rem;font:inherit;font-size:.9rem;resize:vertical;background:#fff;color:var(--ink)}
.steps-ig{margin:0;padding-left:1.2rem;font-size:.9rem;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <p class="lead">拍一張照，用手指寫下你的名字注音，做成一張限時動態，標註我們就完成打卡。</p>
    <div class="tones" aria-hidden="true"><i style="background:var(--grey)"></i><i style="background:var(--teal)"></i><i style="background:var(--pink)"></i><i style="background:var(--gold)"></i></div>
  </header>

  <section class="card" aria-labelledby="s1">
    <h2 id="s1"><span>1</span>拍照 <em>Photo</em></h2>
    <div class="row">
      <button class="btn" id="btnCam" type="button">自拍一張</button>
      <button class="btn alt" id="btnAlbum" type="button">從相簿選</button>
      <button class="btn alt" id="btnNone" type="button">先不用照片</button>
    </div>
    <input id="fileCam" type="file" accept="image/*" capture="user" hidden>
    <input id="fileAlbum" type="file" accept="image/*" hidden>
    <p class="hint" id="photoMsg">目前使用：淺色背景。</p>
  </section>

  <section class="card" aria-labelledby="s2">
    <h2 id="s2"><span>2</span>寫下你的名字 <em>Write</em></h2>
    <p class="hint">對照下面的注音符號，用手指在格子裡一格寫一個字。</p>
    <div class="chart" aria-label="注音符號對照">
      <p>聲母 Initials</p><div id="chInit"></div>
      <p>介音・韻母 Medials & Finals</p><div id="chFin"></div>
    </div>
    <div class="pad" id="pad"><canvas id="guides" width="1200" height="400"></canvas><canvas id="ink" class="ink" width="1200" height="400" aria-label="手寫區"></canvas></div>
    <div class="row" style="align-items:center;justify-content:space-between">
      <div class="pens" id="pens" role="group" aria-label="筆色"></div>
      <div class="row"><button class="btn alt" id="btnUndo" type="button">復原</button><button class="btn alt" id="btnClear" type="button">全部清除</button></div>
    </div>
  </section>

  <section class="card" aria-labelledby="s3">
    <h2 id="s3"><span>3</span>產生圖片 <em>Share</em></h2>
    <div class="stage"><canvas id="story" width="1080" height="1920" aria-label="限時動態預覽"></canvas></div>
    <div class="row"><button class="btn big" id="btnMake" type="button">完成，產生圖片</button></div>
    <div class="result" id="result" hidden>
      <img id="resImg" alt="完成的限時動態圖片">
      <p class="hint"><strong>長按圖片，選「儲存到相簿」</strong>，再打開 Instagram 限時動態上傳。</p>
      <ol class="steps-ig">
        <li>在限時動態選這張照片。</li>
        <li>貼上下方的貼文文字，標註 <span id="handleTxt"></span>。</li>
      </ol>
      <textarea id="cap" readonly aria-label="貼文文字"></textarea>
      <button class="btn alt" id="btnCopy" type="button">複製貼文文字</button>
      <p class="hint" id="copyMsg" aria-live="polite"></p>
    </div>
  </section>
</main>

  function fillChart(id,str,c){var el=$(id);str.split('').forEach(function(ch){var s=document.createElement('span');s.textContent=ch;s.style.setProperty('--c',c);el.appendChild(s);});}
  fillChart('chInit','ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ',COL.grey);
  fillChart('chFin','ㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ',COL.gold);
  $('handleTxt').textContent=HANDLE; $('cap').value=CAPTION;

  // pens
  var pens=$('pens');
  [COL.ink,COL.teal,COL.pink,COL.gold].forEach(function(c,i){
    var b=document.createElement('button');b.type='button';b.className='pen';b.style.setProperty('--c',c);b.setAttribute('aria-label','筆色 '+(i+1));b.setAttribute('aria-pressed',i===0?'true':'false');
    b.onclick=function(){pen=c;[].forEach.call(pens.children,function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');};
    pens.appendChild(b);
  });

  // boxes geometry shared by pad and story
  function boxes(ctx,ox,oy,s,alpha){
    ctx.save();
    for(var i=0;i<3;i++){
      var x=ox+(i*(BS+GAP))*s,y=oy+PY*s,w=BS*s;
      ctx.globalAlpha=alpha;ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(x,y,w,w,26*s);ctx.fill();
      ctx.globalAlpha=1;ctx.strokeStyle='#E3E3E5';ctx.lineWidth=3*s;ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(x+w/2,y+16*s);ctx.lineTo(x+w/2,y+w-16*s);ctx.moveTo(x+16*s,y+w/2);ctx.lineTo(x+w-16*s,y+w/2);ctx.stroke();
      ctx.strokeStyle='#9A9A9E';ctx.lineWidth=5*s;ctx.setLineDash([14*s,9*s]);ctx.beginPath();ctx.roundRect(x,y,w,w,26*s);ctx.stroke();
    }
    ctx.restore();
  }
  var gctx=$('guides').getContext('2d');
  function drawGuidePad(){gctx.clearRect(0,0,PW,PH);boxes(gctx,0,0,1,1);}
  drawGuidePad();

  // handwriting
  var ink=$('ink'),ictx=ink.getContext('2d');
  function strokePath(s){ictx.strokeStyle=s.c;ictx.fillStyle=s.c;ictx.lineWidth=16;ictx.lineCap='round';ictx.lineJoin='round';
    if(s.p.length===1){ictx.beginPath();ictx.arc(s.p[0][0],s.p[0][1],8,0,7);ictx.fill();return;}
    ictx.beginPath();ictx.moveTo(s.p[0][0],s.p[0][1]);for(var i=1;i<s.p.length;i++)ictx.lineTo(s.p[i][0],s.p[i][1]);ictx.stroke();}
  function redrawInk(){ictx.clearRect(0,0,PW,PH);strokes.forEach(strokePath);}
  function pt(e){var r=ink.getBoundingClientRect();return [(e.clientX-r.left)*PW/r.width,(e.clientY-r.top)*PH/r.height];}
  ink.addEventListener('pointerdown',function(e){e.preventDefault();ink.setPointerCapture(e.pointerId);drawing={c:pen,p:[pt(e)]};strokes.push(drawing);redrawInk();});
  ink.addEventListener('pointermove',function(e){if(!drawing)return;drawing.p.push(pt(e));redrawInk();});
  function end(){if(drawing){drawing=null;render();}}
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
  $('btnUndo').onclick=function(){strokes.pop();redrawInk();render();};
  $('btnClear').onclick=function(){strokes=[];redrawInk();render();};

  // photo
  function setPhoto(f,label){
    if(!f)return;
    var done=function(img){photo=img;$('photoMsg').textContent='目前使用：'+label+'。';render();};
    if(window.createImageBitmap){createImageBitmap(f,{imageOrientation:'from-image'}).then(done).catch(function(){fallback(f,done);});}
    else fallback(f,done);
  }
  function fallback(f,done){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){done(im);URL.revokeObjectURL(u);};im.src=u;}
  $('btnCam').onclick=function(){$('fileCam').click()};
  $('btnAlbum').onclick=function(){$('fileAlbum').click()};
  $('btnNone').onclick=function(){photo=null;$('photoMsg').textContent='目前使用：淺色背景。';render();};
  $('fileCam').onchange=function(e){setPhoto(e.target.files[0],'剛拍的照片');e.target.value='';};
  $('fileAlbum').onchange=function(e){setPhoto(e.target.files[0],'相簿照片');e.target.value='';};

  // compose story card
  function cover(ctx,img,w,h){var iw=img.width,ih=img.height,s=Math.max(w/iw,h/ih),dw=iw*s,dh=ih*s;ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);}
  function render(){
    var c=$('story'),x=c.getContext('2d');
    x.clearRect(0,0,W,H);
    if(photo){cover(x,photo,W,H);}
    else{x.fillStyle='#F6F5F5';x.fillRect(0,0,W,H);var sp=120,row=0;for(var y=60;y<H;y+=sp*0.9,row++)for(var xx=(row%2)*sp/2;xx<W+sp;xx+=sp){x.fillStyle=(row+Math.round(xx/sp))%3?'#EFEFEF':'#E6E6E8';x.beginPath();x.arc(xx,y,sp*(0.1+((xx*7+y*3)%10)/100),0,7);x.fill();}}
    var g=x.createLinearGradient(0,0,0,460);g.addColorStop(0,'rgba(57,53,54,.9)');g.addColorStop(1,'rgba(57,53,54,0)');x.fillStyle=g;x.fillRect(0,0,W,460);
    var g2=x.createLinearGradient(0,1020,0,H);g2.addColorStop(0,'rgba(57,53,54,0)');g2.addColorStop(.35,'rgba(57,53,54,.78)');g2.addColorStop(1,'rgba(57,53,54,.95)');x.fillStyle=g2;x.fillRect(0,1020,W,H-1020);
    [COL.grey,COL.teal,COL.pink,COL.gold].forEach(function(col,i){x.fillStyle=col;x.fillRect(i*W/4,0,W/4,14);});
    if(logoW.complete&&logoW.naturalWidth)x.drawImage(logoW,60,92,500,500*190/848);
    x.textBaseline='top';x.fillStyle='#fff';
    x.font='900 54px "Noto Sans TC",sans-serif';x.fillText('我的名字，用注音寫',60,1190);
    x.font='400 30px Poppins,"Noto Sans TC",sans-serif';x.fillStyle='rgba(255,255,255,.75)';x.fillText('My name, in Zhuyin',60,1262);
    var s=960/PW,oy=1290;
    boxes(x,60,oy,s,.94);x.drawImage(ink,60,oy,PW*s,PH*s);
    x.fillStyle='#fff';x.font='700 100px Poppins,"Noto Sans TC",sans-serif';x.fillText('#BOPOMOFO',60,1640);
    x.font='500 38px "Noto Sans TC",sans-serif';x.fillStyle='rgba(255,255,255,.9)';x.fillText(HANDLE+'　把臺灣的注音，帶走',60,1776);
  }
  if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('900 54px "Noto Sans TC"'),document.fonts.load('700 100px Poppins'),document.fonts.load('500 38px "Noto Sans TC"')]).then(render,render);}
  render();

  // export
  var lastUrl=null;
  $('btnMake').onclick=function(){
    render();
    $('story').toBlob(function(b){
      if(!b)return;if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(b);
      $('resImg').src=lastUrl;$('result').hidden=false;$('result').scrollIntoView({behavior:'smooth',block:'start'});
    },'image/png');
  };
  $('btnCopy').onclick=function(){
    var m=$('copyMsg'),t=$('cap');
    function fb(){t.focus();t.select();m.textContent='已選取文字，請手動複製。';}
    try{navigator.clipboard.writeText(CAPTION).then(function(){m.textContent='已複製。';},fb);}catch(e){fb();}
  };
})();
