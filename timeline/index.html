<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設計風格時間軸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&family=Special+Elite&family=Abril+Fatface&family=Jost:wght@500;700&family=Bangers&family=Unbounded:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面概念：白底、無襯線字；上方是醒目的年代尺，下方左右滑動的章節，色彩只留給各風格的重點色與右側圖形 */
:root{
  --bg-page:#ffffff;
  --ink:#151515;
  --dim:#6b6b6b;
  --line:#e6e6e6;
  --soft-bg:#f6f6f6;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-latin:"Jost","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg-page);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* ---------- 年代尺 ---------- */
.top{background:#fff;color:var(--ink);padding:12px 28px 10px;border-bottom:4px solid var(--now,#151515);display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;transition:border-color .4s}
.brand{display:flex;flex-direction:column;gap:2px;min-width:10.5em;padding-bottom:8px}
.brand b{font-weight:700;font-size:.85rem;color:var(--dim);letter-spacing:.06em}
.brand .big{font-family:var(--font-latin);font-weight:700;font-size:clamp(1.6rem,1.4vw + 1.2vh,2.4rem);line-height:1.05;font-variant-numeric:tabular-nums}
.brand #bigName{font-weight:900;font-size:1rem;display:flex;align-items:center;gap:8px}
.brand #bigName::before{content:"";width:12px;height:12px;border-radius:2px;background:var(--now,#151515);transition:background .4s}
.ruler{position:relative;height:170px}
.lanes{position:absolute;left:0;right:0;top:40px;height:160px;--lane:40px}
.war{position:absolute;top:-4px;bottom:-24px;background:repeating-linear-gradient(135deg,rgba(0,0,0,.06) 0 4px,transparent 4px 8px)}
.war em{position:absolute;top:-22px;bottom:auto;left:50%;transform:translateX(-50%);font-style:normal;font-size:.75rem;font-weight:700;color:var(--dim);white-space:nowrap}
.bar{position:absolute;height:27px;border-radius:5px;border:0;cursor:pointer;padding:0 0 0 8px;transition:transform .3s,box-shadow .3s;font:900 1rem/27px var(--font-body);color:#111;text-align:left;white-space:nowrap;overflow:visible;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);letter-spacing:.02em}
.bar span{pointer-events:none;position:relative;z-index:1}
.bar.op span{background:#fff;padding:0 6px;border-radius:3px;margin-left:-4px}
.bar:hover{transform:translateY(-2px)}
.bar.dim{box-shadow:inset 0 0 0 100px rgba(255,255,255,.5),inset 0 0 0 1px rgba(0,0,0,.15);color:#333}
.bar.on{box-shadow:0 0 0 3px #151515,0 6px 14px rgba(0,0,0,.18);transform:translateY(-1px) scale(1.03);z-index:2}
.bar:focus-visible{outline:3px solid #151515;outline-offset:2px}
.axis{position:absolute;left:0;right:0;bottom:0;height:22px;border-top:2px solid #151515}
.tick{position:absolute;top:0;width:1px;height:6px;background:#9a9a9a}
.tick.major{width:2px;height:10px;background:#151515}
.tick b{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:700 .85rem var(--font-latin);color:#151515;font-variant-numeric:tabular-nums}
.needle{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#151515;transition:left .6s cubic-bezier(.6,.05,.2,1),opacity .3s;pointer-events:none;z-index:3}
.needle::after{content:"";position:absolute;bottom:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--now,#151515);box-shadow:0 0 0 3px #fff,0 0 0 5px #151515}
.needle i{position:absolute;top:0;font-style:normal;font-size:.88rem;font-weight:700;background:#151515;color:#fff;padding:2px 10px;border-radius:4px;white-space:nowrap;transform:translateX(-50%)}
.needle.hide{opacity:0}

/* ---------- 章節軌道 ---------- */
.track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;background:#fff}
.track::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;background:#fff;color:var(--ink)}
.info{padding:clamp(32px,6vh,64px) clamp(28px,5vw,80px) clamp(56px,10vh,96px);display:flex;flex-direction:column;gap:clamp(18px,3vh,30px);min-height:var(--ph,100%)}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:clamp(.8rem,.5vw + .5vh,.98rem);color:var(--dim);font-weight:500}
.meta .num{font-family:var(--font-latin);font-weight:700;font-variant-numeric:tabular-nums;background:#151515;color:#fff;padding:2px 9px;border-radius:4px}
.meta .seg{color:var(--ink);font-weight:700;border-left:4px solid var(--accent);padding-left:8px}
h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;text-wrap:balance}
h2 .zh{font-weight:900;font-size:clamp(2.1rem,2.5vw + 2.1vh,4.2rem);line-height:1.08;letter-spacing:.01em}
h2 .en{font-family:var(--font-latin);font-weight:500;font-size:clamp(1.05rem,1vw + .9vh,1.8rem);color:var(--dim);line-height:1.1}
.motto{align-self:flex-start;font-weight:900;font-size:clamp(1.1rem,1vw + 1vh,1.8rem);background:var(--accent);color:var(--on-accent,#fff);padding:4px 16px 6px;border-radius:4px;letter-spacing:.1em}
.cols{display:flex;flex-direction:column;gap:clamp(24px,4vh,40px);margin-top:clamp(4px,1vh,12px)}
.cols section{border-top:1px solid var(--line);padding-top:clamp(14px,2.2vh,20px)}

h3{font-size:clamp(.78rem,.42vw + .5vh,.92rem);letter-spacing:.12em;color:var(--dim);margin-bottom:6px;font-weight:700}
.info p,.info li{font-size:clamp(1.02rem,.55vw + .8vh,1.3rem);line-height:1.85;max-width:34em}
h3{margin-bottom:10px!important}
.info ul{gap:10px!important}
.works li{display:flex;justify-content:space-between;gap:16px;max-width:34em}
.works li small{display:inline!important;white-space:nowrap;padding-top:.15em}
.info ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.info ul li{padding-left:1.05em;position:relative}
.info ul li::before{content:"";position:absolute;left:0;top:.66em;width:.42em;height:.42em;border-radius:50%;background:var(--accent)}
.works li small{display:block;font-family:var(--font-latin);font-size:.82em;color:var(--dim);line-height:1.4}
/* 右欄：作品輪播／互動示意 */
.art{position:sticky;top:0;height:var(--ph,100%);overflow:hidden;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
.intro .art{display:block}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.art canvas:focus-visible{outline:4px solid #151515;outline-offset:-4px}
.stage{position:relative;flex:1;min-height:0}
.art .cap{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);font-size:.72rem;background:rgba(255,255,255,.94);color:var(--dim);padding:6px 10px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.12);pointer-events:none;line-height:1.45}
.art .cap b{display:block;color:var(--ink);font-size:.86rem}
.playbar{flex:none;border-top:1px solid var(--line);background:#fff;padding:12px 16px 12px;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.mlabel{font-size:.78rem;font-weight:700;color:var(--dim);letter-spacing:.06em}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font:700 .9rem var(--font-body);border:1.5px solid var(--accent);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:38px}
.mchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent,#fff)}
.mhint{display:flex;align-items:center;gap:8px;font-size:.92rem;line-height:1.5}
.mhint b{flex:none;font-size:.78rem;background:#151515;color:#fff;padding:2px 8px;border-radius:4px}
.mhint span{flex:1}
.reset{flex:none;font:700 .82rem var(--font-body);border:1px solid var(--line);background:var(--soft-bg);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer;min-height:34px}
.mnote{font-size:.72rem;color:var(--dim)}
.art[data-mode="work"] .playbar{display:none}
.workview{position:absolute;inset:0;z-index:4;background:#fff;display:none;flex-direction:column;padding:clamp(56px,8vh,70px) 0 12px}
.art[data-mode="work"] .workview{display:flex}
.slides{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 clamp(16px,3vw,44px);min-width:0}
.slide .frame{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.slide img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 6px 24px rgba(0,0,0,.14);border-radius:2px}
.slide figcaption{align-self:stretch;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px;text-align:center}
.slide figcaption b{font-size:clamp(1rem,.55vw + .8vh,1.25rem);text-wrap:balance}
.slide .who{font-size:clamp(.9rem,.45vw + .6vh,1.05rem)}
.slide .src{font-size:.78rem;color:var(--dim)}
.snav{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px 0}
.sbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font:700 1.3rem/1 var(--font-body);color:var(--ink);cursor:pointer}
.sbtn:hover{background:var(--soft-bg)}
.sdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sdot{width:9px;height:9px;border-radius:50%;border:0;background:#d6d6d6;padding:0;cursor:pointer}
.sdot[aria-current="true"]{background:var(--accent);transform:scale(1.25)}
.scount{font-family:var(--font-latin);font-weight:700;font-size:.85rem;color:var(--dim);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.workview.missing{align-items:center;justify-content:center;padding:70px 20px 20px}
.workview.missing .ph{border:2px dashed #c9c9c9;border-radius:8px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:8px;background:var(--soft-bg);max-width:26em}
.workview.missing .ph span{font-weight:700}
.workview.missing .ph small{color:var(--dim)}
.viewtabs{position:absolute;top:12px;right:12px;z-index:5;display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.viewtabs button{font:700 .85rem var(--font-body);border:0;background:none;color:var(--dim);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:36px}
.art[data-mode="work"] .viewtabs [data-view="work"],.art[data-mode="play"] .viewtabs [data-view="play"]{background:#151515;color:#fff}
.viewtabs button:focus-visible,.mchip:focus-visible,.reset:focus-visible,.sbtn:focus-visible,.sdot:focus-visible,.btn:focus-visible,.chip:focus-visible,.dot:focus-visible,.reveal:focus-visible,.grow:focus-visible{outline:3px solid #151515;outline-offset:2px}

/* 開場與總結 */
.intro,.outro{--accent:#151515}
.intro .art .cap{top:12px;bottom:auto;max-width:calc(100% - 24px)}
h1{text-wrap:balance;font-weight:900}
.intro .info{justify-content:center}
.intro h1{font-size:clamp(2.3rem,2.8vw + 2.4vh,4.6rem);line-height:1.12}
.lead{font-size:clamp(1rem,.6vw + .9vh,1.35rem);color:var(--dim)}
.q{font-weight:900;font-size:clamp(1.15rem,1vw + 1.1vh,1.9rem);border-left:6px solid #151515;padding:4px 0 4px 14px}
.segs{display:grid;gap:10px}
.segrow{display:grid;grid-template-columns:6.5em 1fr;gap:12px;align-items:center}
.segrow b{font-size:clamp(.85rem,.5vw + .6vh,1.05rem)}
.segrow b small{display:block;font-weight:500;color:var(--dim);font-size:.82em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;cursor:pointer;font:700 clamp(.85rem,.45vw + .6vh,1.02rem) var(--font-body);padding:6px 12px;border-radius:4px;color:#111;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chip:hover{transform:translateY(-1px)}
.hint{font-size:.9rem;color:var(--dim)}
.hint kbd{font-family:var(--font-body);border:1px solid #c9c9c9;border-bottom-width:2px;border-radius:4px;padding:0 6px;background:#fff;color:var(--ink)}

.gantt{position:sticky;top:0;min-height:var(--ph,100%);padding:clamp(32px,6vh,64px) clamp(20px,3vw,48px);display:flex;flex-direction:column;justify-content:center;gap:10px;background:#fff;border-left:1px solid var(--line)}
.grow{display:grid;grid-template-columns:6.2em 1fr;align-items:center;gap:10px;border:0;background:none;text-align:left;cursor:pointer;padding:3px 4px;border-radius:4px;font:inherit;color:inherit}
.grow:hover{background:var(--soft-bg)}
.grow .gl{font-weight:700;font-size:clamp(.85rem,.45vw + .6vh,1.02rem)}
.gtrack{position:relative;height:clamp(18px,2.4vh,28px)}
.gbar{position:absolute;top:0;bottom:0;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.glab{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--font-latin);font-size:.78rem;font-weight:700;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 6px}
.gwar{position:absolute;top:-4px;bottom:-4px;background:repeating-linear-gradient(135deg,rgba(0,0,0,.06) 0 4px,transparent 4px 8px)}
.gaxis{display:grid;grid-template-columns:6.2em 1fr;gap:10px;padding:0 4px}
.gaxis div{position:relative;height:20px;border-top:2px solid #151515}
.gaxis b{position:absolute;top:4px;transform:translateX(-50%);font-family:var(--font-latin);font-size:.78rem;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.reveal{align-self:flex-start;font:700 1rem var(--font-body);background:#151515;color:#fff;border:0;border-radius:4px;padding:10px 18px;cursor:pointer}
.answers{display:grid;gap:8px}
.answers[hidden]{display:none}
.answers div{background:var(--soft-bg);border-left:5px solid var(--c);padding:9px 12px;border-radius:4px}
.answers b{display:block;font-size:clamp(.95rem,.5vw + .7vh,1.18rem)}
.answers span{font-size:clamp(.85rem,.45vw + .6vh,1.02rem);color:var(--dim)}

/* ---------- 導覽列 ---------- */
.nav{background:#fff;color:var(--ink);display:flex;align-items:center;gap:12px;padding:8px 24px;border-top:1px solid var(--line)}
.btn{font:700 .95rem var(--font-body);background:var(--soft-bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
.btn:hover{background:#ececec}
.btn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:26px;height:8px;border:0;border-radius:4px;background:#dedede;cursor:pointer;padding:0}
.dot[aria-current="true"]{background:#151515}
.count{font-family:var(--font-latin);font-weight:700;font-variant-numeric:tabular-nums;color:var(--dim);font-size:.95rem;min-width:4.5em;text-align:right}

/* ---------- 單欄閱讀版面：每一頁上下捲動 ---------- */
.panel,.panel.intro,.panel.outro{display:block;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:960px;margin:0 auto;padding:clamp(28px,5vh,56px) clamp(20px,4vw,48px) 96px;display:flex;flex-direction:column;gap:clamp(40px,7vh,72px)}
.phead{display:flex;flex-direction:column;gap:14px}
.blk > h3{display:flex;align-items:center;gap:10px;font-size:.95rem;letter-spacing:.14em;color:var(--ink);margin-bottom:18px!important}
.blk > h3::before{content:"";width:22px;height:4px;border-radius:2px;background:var(--accent)}
.wrap p,.wrap li{font-size:clamp(1rem,.45vw + .75vh,1.2rem);line-height:1.85}
.ctx{max-width:40em}
.wrap .works{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:18px;max-width:40em}
.wrap .works li{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:8px}
.wrap .works li small{color:var(--dim);font-family:var(--font-latin);white-space:nowrap}
.workview{position:relative;inset:auto;z-index:auto;display:flex;height:clamp(380px,64vh,620px);background:var(--soft-bg);border-radius:14px;padding:24px 0 14px}
.workview.missing{height:auto;padding:28px;background:none}
.slide img{box-shadow:0 8px 28px rgba(0,0,0,.16)}
.feat{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.feat li{border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.feat .fn{font-family:var(--font-latin);font-weight:700;font-size:1.5rem;color:var(--accent);line-height:1}
.feat p{flex:1;font-size:clamp(1rem,.4vw + .7vh,1.12rem)!important;line-height:1.7!important}
.ftry{align-self:flex-start;font:700 .85rem var(--font-body);border:0;background:var(--soft-bg);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.ftry:hover{background:#ececec}
.blk .art{position:relative;top:auto;height:auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.blk .stage{flex:none;height:clamp(320px,56vh,540px)}
.playbar{border-top:1px solid var(--line)}
.contemp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ccard{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.ccard .cmeta{display:flex;align-items:center;gap:10px;font-size:.85rem!important;color:var(--dim);font-family:var(--font-latin)}
.ccard .cmeta span{font-family:var(--font-body);font-weight:700;font-size:.78rem;background:var(--soft-bg);color:var(--ink);padding:2px 10px;border-radius:999px}
.ccard h4{font-size:1.12rem;line-height:1.4}
.ccard p{font-size:1rem!important;line-height:1.7!important}
.ccard .cfeat{font-size:.88rem!important;color:var(--dim)}
.ccard a{font-size:.88rem;font-weight:700;color:var(--ink);text-underline-offset:3px}
.intro .info,.outro .info{max-width:960px;margin:0 auto;min-height:0;padding:clamp(28px,5vh,56px) clamp(20px,4vw,48px) 32px}
.intro .art{position:relative;top:auto;height:clamp(300px,52vh,540px);max-width:calc(960px - 2*clamp(20px,4vw,48px));margin:0 auto 72px;border:1px solid var(--line);border-radius:14px}
.outro .gantt{position:relative;top:auto;min-height:0;max-width:calc(960px - 2*clamp(20px,4vw,48px));margin:0 auto 72px;border:1px solid var(--line);border-radius:14px}
@media (max-width:860px){
  .top{grid-template-columns:1fr;gap:2px;padding:8px 14px 6px}
  .brand{flex-direction:row;gap:4px 10px;align-items:baseline;flex-wrap:wrap;padding-bottom:2px;min-width:0}
  .brand b{display:none}
  .brand .big{font-size:1.35rem}
  .brand #bigName{font-size:.95rem}
  .ruler{height:118px}
  .lanes{top:30px;height:104px;--lane:26px}
  .bar{height:20px;line-height:20px;font-size:12px;padding-left:4px;letter-spacing:0}
  .bar.op span{padding:0 2px;margin-left:-1px}
  .bar.on{box-shadow:0 0 0 2px #151515}
  .war{bottom:-20px}
  .war em{font-size:.62rem}
  .tick b{font-size:.68rem;top:7px}
  .needle i{font-size:.7rem;padding:1px 6px}
  .needle::after{width:11px;height:11px;margin-left:-5.5px}
  .wrap{padding:22px 16px 64px;gap:44px}
  h2 .zh{font-size:2rem}
  .feat{grid-template-columns:1fr}
  .contemp{grid-template-columns:1fr}
  .workview{height:66vh;border-radius:10px}
  .blk .stage{height:46vh}
  .mchip{font-size:.85rem;padding:6px 12px}
  .wrap .works li{flex-direction:column;gap:0}
  .intro .info,.outro .info{padding:22px 16px 24px}

function workView(id){
  const w = WORK[id];
  if (!w) return "";
  if (w.need) return `<figure class="workview missing"><div class="ph"><b>待補作品圖片</b><span>${w.need}</span><small>教案附圖裡沒有這件作品，上傳圖片後就能放上來。</small></div></figure>`;
  const n = w.slides.length;
  const slides = w.slides.map((s,i) => `
      <figure class="slide" aria-label="第 ${i+1} 張，共 ${n} 張">
        <div class="frame"><img src="${s.src}" alt="${s.who}${s.title}" ${i ? 'loading="lazy"' : ""}></div>
        <figcaption><b>${s.title}</b><span class="who">${s.who}｜${s.year}</span><span class="src">${s.note}｜${s.credit ? "圖片：" + s.credit : "圖片取自教案附圖"}</span></figcaption>
      </figure>`).join("");
  const dots = w.slides.map((s,i) => `<button type="button" class="sdot" data-slide="${i}" aria-label="看第 ${i+1} 張：${s.title}"></button>`).join("");
  return `<div class="workview" data-count="${n}">
      <div class="slides">${slides}</div>
      <div class="snav"><button type="button" class="sbtn" data-step="-1" aria-label="上一張作品">‹</button><div class="sdots">${dots}</div><span class="scount">1 / ${n}</span><button type="button" class="sbtn" data-step="1" aria-label="下一張作品">›</button></div>
    </div>`;
}

function barBg(st){
  return st.bar === "op" ? "repeating-linear-gradient(90deg,#f4f4f4 0 5px,#111 5px 10px)" : st.bar;
}
STYLES.forEach((st,i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "bar"; b.dataset.i = i + 1;
  b.style.left = pct(st.s) + "%";
  b.style.width = (pct(st.e) - pct(st.s)) + "%";
  b.style.top = `calc(var(--lane, 22px) * ${st.lane})`;
  if (st.bar === "op") b.classList.add("op");
  b.style.background = barBg(st);
  b.title = `${st.zh}（${st.years}）`;
  b.setAttribute("aria-label", `跳到${st.zh}，${st.years}`);

});
for (let y = Y0; y <= Y1; y += 10) {

}

    </div>

    </div>`;
  return sec;
}

  const labs = c.pair.map((p,k) => `<span><b>${k ? "右" : "左"}</b>${p.t.split("｜")[0]}</span>`).join("");

  return fcard(`<div class="fimg3" style="--n:${c.pair.length}">${slots}</div><p class="pairlab">${labs}</p><p class="cmeta"><span>${c.k}</span>${c.y}</p><b class="fq">${c.t}</b><p class="fsmall">${c.ask || "猜猜看：左右兩件作品，哪裡像慕夏？"}</p>`,

function syncProg(panel){
  const all = panel.querySelectorAll(".fcard"), on = panel.querySelectorAll(".fcard.flipped");
  const pg = panel.querySelector(".fprog"), btn = panel.querySelector(".flipall");
  if (pg) pg.textContent = `已翻開 ${on.length} / ${all.length} 張`;
  if (btn) btn.textContent = on.length === all.length ? "全部蓋回" : "全部翻開";
}
function flip(card, v){ const f = v === undefined ? !card.classList.contains("flipped") : v; card.classList.toggle("flipped", f); card.setAttribute("aria-pressed", String(f)); }
document.addEventListener("click", e => {
  if (e.target.closest("a, button, label, input")) return;
  const card = e.target.closest(".fcard"); if (!card) return;
  flip(card); syncProg(card.closest(".panel"));
});
document.addEventListener("keydown", e => {
  const card = e.target.closest && e.target.closest(".fcard");
  if (!card || e.target !== card || !(e.key === "Enter" || e.key === " ")) return;
  e.preventDefault(); flip(card); syncProg(card.closest(".panel"));
});
document.querySelectorAll(".flipall").forEach(b => b.addEventListener("click", () => {
  const panel = b.closest(".panel"), cards = [...panel.querySelectorAll(".fcard")];
  const allOn = cards.every(c => c.classList.contains("flipped"));
  cards.forEach((c,k) => setTimeout(() => { flip(c, !allOn); if (k === cards.length - 1) syncProg(panel); }, reduce ? 0 : k*40));
}));
panels.forEach(syncProg);
document.getElementById("lucky").addEventListener("click", () => {
  const panel = panels[0], all = [...panel.querySelectorAll(".pick")];
  let pool = all.filter(c => !c.classList.contains("flipped"));
  if (!pool.length) { all.forEach(c => flip(c, false)); pool = all; }
  const card = pool[Math.floor(Math.random()*pool.length)];
  card.classList.remove("lucky"); void card.offsetWidth; card.classList.add("lucky");
  setTimeout(() => { flip(card, true); syncProg(panel); }, reduce ? 0 : 650);
});

const dotsEl = document.getElementById("dots");

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur = 0, view = "cards", labIdx = 0;
const appEl = document.querySelector(".app"), labEl = document.getElementById("lab");
function setView(v){
  view = v; appEl.dataset.view = v; labEl.hidden = v !== "lab";
  document.querySelectorAll(".vswitch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  if (v === "lab") { if (cur >= 1 && cur <= STYLES.length) labIdx = cur - 1; setLab(labIdx); }
  else requestAnimationFrame(() => track.scrollTo({ left: cur*track.clientWidth, behavior: "auto" }));
  update();
}
function pickStyle(i){ view === "lab" ? setLab(i) : go(i + 1); }
function step(d){ view === "lab" ? setLab(labIdx + d) : go(cur + d); }
function go(i){
  i = Math.max(0, Math.min(panels.length - 1, i));
  track.scrollTo({ left: i * track.clientWidth, behavior: reduce ? "auto" : "smooth" });
  if (i !== cur) { cur = i; update(); }
}
track.addEventListener("scroll", () => {
  const i = Math.round(track.scrollLeft / track.clientWidth);
  if (i !== cur) { cur = i; update(); }
}, { passive:true });

const needle = document.getElementById("needle");
const needleLabel = document.getElementById("needleLabel");
function update(){
  const lab = view === "lab";
  dots.forEach((d,i) => d.setAttribute("aria-current", String(!lab && i === cur)));
  document.getElementById("count").textContent = lab ? `實驗室 ${labIdx + 1} / ${STYLES.length}` : `${cur + 1} / ${panels.length}`;
  document.getElementById("prev").disabled = lab ? labIdx === 0 : cur === 0;
  document.getElementById("next").disabled = lab ? labIdx === STYLES.length - 1 : cur === panels.length - 1;
  const st = lab ? STYLES[labIdx] : STYLES[cur - 1];
  STYLES.forEach(s => { s.barEl.classList.toggle("on", s === st); s.barEl.classList.toggle("dim", !!st && s !== st); });
  const root = document.documentElement;
  const nowColor = st ? (st.bar === "op" ? "#151515" : st.bar) : "#151515";
  root.style.setProperty("--now", nowColor);
  if (st) st.barEl.style.setProperty("--glow", nowColor);
  document.getElementById("bigYear").textContent = st ? st.years.replace("約 ","") : (cur === 0 ? "1851–1990" : "總覽");
  document.getElementById("bigName").textContent = st ? st.zh : (cur === 0 ? "九個設計風格" : "放在同一條時間線上");

    needle.classList.remove("hide");
    needle.style.left = pct(st.event[0]) + "%";
    needleLabel.textContent = st.event[1];
    const p = pct(st.event[0]);
    needleLabel.style.transform = p < 12 ? "translateX(0)" : p > 82 ? "translateX(-100%)" : "translateX(-50%)";
  } else {
    needle.classList.add("hide");
  }
  startLoop();
}

window.addEventListener("keydown", e => {

  else if (["ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); step(-1); }

function drawCanvas(cv, t){
  const rect = cv.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(rect.width*dpr), H = Math.round(rect.height*dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const c = cv.getContext("2d");
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,rect.width,rect.height);
  D[cv.dataset.draw](c, rect.width, rect.height, t, cv.dataset.mini === "1");

  if (!cvs.length || paused) return;

    const src = d.url || (d.asset ? "/_blob/" + d.asset : "");
    if (!src) return;
    document.querySelectorAll(`.fimg[data-slot="${slot}"]`).forEach(fr => {
      fr.classList.remove("fimg-need"); fr.dataset.slot = slot;
      fr.innerHTML = `<img src="${src}" alt="" loading="lazy">` + (assets ? upBtn(slot).replace(" hidden", "").replace("上傳圖片", "換圖") : "");
      bindUp(fr);
    });
    document.querySelectorAll(`[data-credit="${slot}"]`).forEach(p => { if (d.credit) { p.hidden = false; p.textContent = "圖片：" + d.credit; } else if (slot.startsWith("c-")) { p.hidden = true; const a = p.parentElement.querySelector("a.imgref"); if (a) a.hidden = true; } });
  };
  function bindUp(root){
    root.querySelectorAll("input[data-up]").forEach(inp => {
      if (inp.dataset.bound) return; inp.dataset.bound = "1";
      inp.addEventListener("change", async () => {
        const f = inp.files && inp.files[0]; if (!f || !assets || !db) return;
        const lab = inp.closest(".upbtn"); if (lab) lab.lastChild.textContent = "上傳中…";
        try {
          const r = await assets.upload(f);
          const slot = inp.dataset.up;
          await db.collection("photos").doc(slot).set({ asset: r.id, url: r.url });
          apply(slot, { asset: r.id, url: r.url });
        } catch (e) { if (lab) lab.lastChild.textContent = "上傳失敗，再試一次"; }
      });
    });
  }
  async function put(slot, f, lab){
    if (!f || !assets || !db) return;
    if (lab) lab.lastChild.textContent = "上傳中…";
    try {
      const r = await assets.upload(f);
      await db.collection("photos").doc(slot).set({ asset: r.id, url: r.url });
      apply(slot, { asset: r.id, url: r.url });
    } catch (e) { if (lab) lab.lastChild.textContent = "上傳失敗，再試一次"; }
  }
  window.__putPhoto = put;
  if (assets && db) {
    const eb = document.createElement("button");
    eb.type = "button"; eb.className = "editimgbtn"; eb.textContent = "✎ 換圖（只有你看得到）";
    eb.addEventListener("click", () => { const on = document.body.classList.toggle("editimg"); eb.textContent = on ? "✓ 完成換圖" : "✎ 換圖（只有你看得到）"; });
    document.body.appendChild(eb);
    document.querySelectorAll(".upbtn").forEach(l => l.hidden = false); bindUp(document);
    document.addEventListener("dragover", e => { if (e.target.closest && e.target.closest(".fimg[data-slot]")) e.preventDefault(); });
    document.addEventListener("drop", e => {
      const fr = e.target.closest && e.target.closest(".fimg[data-slot]"); if (!fr || (!fr.classList.contains("fimg-need") && !document.body.classList.contains("editimg"))) return;
      e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      put(fr.dataset.slot, f, fr.querySelector(".upbtn"));
    });
  }
  if (db) {
    try { db.collection("photos").onSnapshot(snap => { (snap.docs || snap).forEach(doc => { const d = typeof doc.data === "function" ? doc.data() : doc.data; apply(doc.id, d || {}); }); }); } catch (e) {}
  }
})();

update();
drawAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
</script>
